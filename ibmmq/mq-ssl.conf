# IBM MQ SSL Configuration
#
# This is a basic SSL configuration for IBM MQ

# SSL Cipher specifications
SSL:
  Ciphers:
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    - TLS_RSA_WITH_AES_256_GCM_SHA384
    - TLS_RSA_WITH_AES_128_GCM_SHA256

# SSL Key and Trust stores (these would be mounted from host)
# Key store location:
#   /opt/mqm/qmgrs/QM1/ssl/key.kdb
# Trust store location:
#   /opt/mqm/qmgrs/QM1/ssl/trust.kdb

# SSL Configuration for queue manager
QMGR:
  SSL:
    KeyRepository: /opt/mqm/qmgrs/QM1/ssl/key.kdb
    TrustRepository: /opt/mqm/qmgrs/QM1/ssl/trust.kdb
    KeyRepositoryPassword: password
    CipherSpec: TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384

# Channel configuration for SSL
CHANNELS:
  SSL:
    - CHLNAME(SVRCONN)
      - SSLCAUTH(REQCERT)
      - SSLCIPHER(TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384)
