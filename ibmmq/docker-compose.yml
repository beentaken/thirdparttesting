
services:

  # ----------------------------------------
  # 1. SSL Certificate Generator
  # ----------------------------------------
  cert-generator:
    build:
      context: ./cert-generator
      dockerfile: Dockerfile

    container_name: mq-cert-generator

    volumes:
      - ./certs/mqweb:/certs

    restart: "no"

  # ----------------------------------------
  # 2. IBM MQ Queue Manager
  # ----------------------------------------
  ibm-mq:
    image: icr.io/ibm-messaging/mq:latest

    container_name: ibm-mq
    hostname: ibm-mq

    depends_on:
      cert-generator:
        condition: service_completed_successfully

    ports:
      - "1414:1414"
      - "9443:9443"

    environment:
      LICENSE: accept

      MQ_QMGR_NAME: QM1

      MQ_ADMIN_USER: admin
      MQ_ADMIN_PASSWORD: passw0rd

      MQ_APP_USER: app
      MQ_APP_PASSWORD: passw0rd

    volumes:
      # Generated SSL certificate
      - ./certs/mqweb:/etc/mqm/pki/keys/mqweb:ro

      # Persistent IBM MQ data
      - mqdata:/mnt/mqm

    restart: unless-stopped

volumes:
  mqdata:
    name: ibm-mq-data
