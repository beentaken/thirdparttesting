services:
  certs:
    build:
      context: ./certs
    container_name: es_certs_init
    volumes:
      - es_certs:/certs
    restart: "no"

  elasticsearch:
    build:
      context: ./es
      args:
        ES_VERSION: 8.17.0
    container_name: es_node
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS}
    ports:
      - "9200:9200"
    volumes:
      - es_certs:/usr/share/elasticsearch/config/certs:ro
      - es_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca.crt -u elastic:$$ELASTIC_PASSWORD https://localhost:9200 | grep -q cluster_name"
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # One-shot: sets the password for the kibana_system user
  kibana-setup:
    build:
      context: ./es
      args:
        ES_VERSION: 8.17.0
    container_name: es_kibana_setup
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:?KIBANA_PASSWORD is not set in .env}
    volumes:
      - es_certs:/certs:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Setting kibana_system password..."
        code=$$(curl -s -o /tmp/out -w "%{http_code}" --cacert /certs/ca.crt \
          -u "elastic:$$ELASTIC_PASSWORD" \
          -X POST https://elasticsearch:9200/_security/user/kibana_system/_password \
          -H "Content-Type: application/json" \
          -d "{\"password\":\"$$KIBANA_PASSWORD\"}")
        echo "HTTP $$code"
        cat /tmp/out
        [ "$$code" = "200" ]
    restart: "no"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: es_kibana
    depends_on:
      kibana-setup:
        condition: service_completed_successfully
    environment:
      SERVER_NAME: kibana
      ELASTICSEARCH_HOSTS: https://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD}
      ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES: /usr/share/kibana/config/certs/ca.crt
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY}
    ports:
      - "5601:5601"
    volumes:
      - es_certs:/usr/share/kibana/config/certs:ro   # fixed path
    restart: unless-stopped

volumes:
  es_certs:
  es_data: