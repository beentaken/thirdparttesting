version: '3.8'
services:
  # 1. Generate self-signed HTTPS certificate
  cert-generator:
    image: certbot/certbot
    command: certonly --standalone --email your-email@example.com --agree-tos --no-eff-email --domains yourdomain.com
    volumes:
      - ./certs:/etc/letsencrypt
    restart: unless-stopped

  # 2. Nginx HTTPS reverse proxy
  nginx:
    image: nginx:latest
    container_name: nginx-https
    depends_on:
      cert-generator:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # 3. Example backend service
  backend:
    image: python:3.12-slim
    container_name: backend
    working_dir: /app
    command: >
      python -m http.server 8000
    expose:
      - "8000"
    restart: unless-stopped