
services:
  # 1. Generate self-signed HTTPS certificate
  cert-generator:
    image: alpine:latest
    container_name: cert-generator
    volumes:
      - ./certs:/certs
    entrypoint: ["/bin/sh", "-c"]
    command: |
      apk add --no-cache openssl &&
      openssl req -new -x509 -nodes -days 365 \
        -newkey rsa:2048 \
        -keyout /certs/tls.key \
        -out /certs/tls.crt \
        -subj '/C=SG/ST=Singapore/L=Singapore/O=Organization/CN=localhost' \
        -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' &&
      chmod 644 /certs/tls.crt &&
      chmod 600 /certs/tls.key
    restart: "no"

  # 2. Nginx HTTPS reverse proxy
  nginx:
    image: nginx:latest
    container_name: nginx-https
    depends_on:
      cert-generator:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # 3. Example backend service
  backend:
    image: python:3.12-slim
    container_name: backend
    working_dir: /app
    command: >
      python -m http.server 8000
    expose:
      - "8000"
    restart: unless-stopped

