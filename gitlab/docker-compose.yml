services:
  init:
    image: alpine
    command: mkdir -p /v/config /v/logs /v/data
    volumes:
      - gitlab_all:/v

  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    restart: always
    hostname: localhost
    shm_size: '256m'
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost'
        gitlab_rails['initial_root_password'] = 'YourStrongPassword123!'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
    ports:
      - '80:80'
      - '443:443'
      - '2222:22'
    volumes:
      - type: volume
        source: gitlab_all
        target: /etc/gitlab
        volume: { subpath: config }
      - type: volume
        source: gitlab_all
        target: /var/opt/gitlab
        volume: { subpath: data }
      - type: volume
        source: gitlab_all
        target: /var/log/gitlab
        volume: { subpath: logs }

volumes:
  gitlab_all: