services:

  # Generate CA and server certificates
  cert-generator:
    image: alpine:latest
    container_name: weaviate-cert-generator
    volumes:
      - ./certs:/certs
    command: >
      sh -c '
        apk add --no-cache openssl &&
        if [ ! -f /certs/server.crt ]; then

          echo "Generating CA private key...";
          openssl genrsa -out /certs/ca.key 4096;

          echo "Generating CA certificate...";
          openssl req -x509 -new -nodes
            -key /certs/ca.key
            -sha256
            -days 3650
            -out /certs/ca.crt
            -subj "/C=SG/ST=Singapore/O=LocalLab/CN=Weaviate-Root-CA";

          echo "Generating server private key...";
          openssl genrsa -out /certs/server.key 2048;

          echo "Generating server CSR...";
          openssl req -new
            -key /certs/server.key
            -out /certs/server.csr
            -subj "/C=SG/ST=Singapore/O=LocalLab/CN=localhost";

          echo "Creating SAN configuration...";
          printf "subjectAltName=DNS:localhost,DNS:weaviate,DNS:nginx,IP:127.0.0.1\nextendedKeyUsage=serverAuth\nkeyUsage=digitalSignature,keyEncipherment\n" > /certs/server.ext;

          echo "Signing server certificate...";
          openssl x509 -req
            -in /certs/server.csr
            -CA /certs/ca.crt
            -CAkey /certs/ca.key
            -CAcreateserial
            -out /certs/server.crt
            -days 825
            -sha256
            -extfile /certs/server.ext;

          chmod 644 /certs/ca.crt /certs/server.crt;
          chmod 600 /certs/ca.key /certs/server.key;

          echo "Certificates generated successfully!";
        else
          echo "Certificates already exist.";
        fi
      '

  # Weaviate database
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.40.4
    container_name: weaviate
    restart: unless-stopped
    depends_on:
      cert-generator:
        condition: service_completed_successfully
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: "node1"
    volumes:
      - weaviate_data:/var/lib/weaviate
    expose:
      - "8080"
      - "50051"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # HTTPS reverse proxy
  nginx:
    image: nginx:alpine
    container_name: weaviate-nginx
    restart: unless-stopped
    depends_on:
      cert-generator:
        condition: service_completed_successfully
      weaviate:
        condition: service_started
    ports:
      - "8443:443"
      - "50052:50052"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  weaviate_data: