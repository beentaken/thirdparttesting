services:

  # ==========================================
  # 1. OpenSSL Certificate Generator
  # ==========================================
  cert-generator:
    image: alpine:latest
    container_name: keycloak-cert-generator

    entrypoint: ["/bin/sh", "-c"]

    command:
      - |
        set -eux

        echo "Installing OpenSSL..."

        apk update
        apk add --no-cache openssl

        echo "Checking certificate directory..."

        mkdir -p /certs

        if [ -s /certs/tls.crt ] && [ -s /certs/tls.key ]; then
          echo "Existing certificates found."

        else
          echo "Generating new SSL certificates..."

          openssl req -x509 -nodes -days 365 \
            -newkey rsa:2048 \
            -keyout /certs/tls.key \
            -out /certs/tls.crt \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1,DNS:keycloak"

          echo "Setting permissions..."

          chmod 644 /certs/tls.crt
          chmod 640 /certs/tls.key

          chown 1000:0 /certs/tls.crt /certs/tls.key

          echo "Certificate generated successfully."
        fi

        echo "Verifying certificate..."

        openssl x509 -in /certs/tls.crt -noout -subject
        openssl pkey -in /certs/tls.key -noout -check

        echo "Certificate setup completed."

    volumes:
      - keycloak-certs:/certs
  # ==========================================
  # 2. Keycloak
  # ==========================================
  keycloak:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: keycloak

    depends_on:
      cert-generator:
        condition: service_completed_successfully

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123

      # HTTP
      KC_HTTP_ENABLED: "true"

      # HTTPS
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/certs/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/certs/tls.key

      # Keep management interface HTTP
      # This avoids requiring a separate management TLS configuration.
      KC_HTTP_MANAGEMENT_SCHEME: http

    ports:
      - "8080:8080"
      - "8443:8443"

    volumes:
      - keycloak-certs:/opt/keycloak/conf/certs
      - keycloak-data:/opt/keycloak/data

    restart: unless-stopped

# ==========================================
# 3. Persistent Volumes
# ==========================================
volumes:

  keycloak-certs:
    name: keycloak-certs

  keycloak-data:
    name: keycloak-data