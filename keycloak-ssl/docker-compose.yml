services:
  cert-generator:
    image: alpine:latest
    volumes:
      - ./certs:/certs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache openssl >/dev/null
        mkdir -p /certs
        if [ ! -f /certs/tls.crt ] || [ ! -f /certs/tls.key ]; then
          openssl genrsa -out /certs/tls.key 2048
          openssl req -new -key /certs/tls.key -out /certs/cert.csr \
            -subj "/C=SG/ST=Singapore/L=Singapore/O=Development/OU=Keycloak/CN=localhost" -batch
          cat > /certs/ext.cnf <<'EOF'
        [v3_req]
        basicConstraints = CA:FALSE
        keyUsage = digitalSignature, keyEncipherment
        extendedKeyUsage = serverAuth
        subjectAltName = @alt_names
        [alt_names]
        DNS.1 = localhost
        DNS.2 = keycloak
        IP.1 = 127.0.0.1
        IP.2 = ::1
        EOF
          openssl x509 -req -in /certs/cert.csr -signkey /certs/tls.key \
            -out /certs/tls.crt -days 3650 -sha256 \
            -extfile /certs/ext.cnf -extensions v3_req
          rm -f /certs/cert.csr /certs/ext.cnf
        fi
        chmod 644 /certs/tls.crt
        chmod 644 /certs/tls.key   # relax for non-root keycloak in dev

  keycloak:
    build: { context: ., dockerfile: Dockerfile }
    depends_on:
      cert-generator:
        condition: service_completed_successfully
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
      KC_HTTP_ENABLED: "true"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/certs/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/certs/tls.key
      KC_HTTP_MANAGEMENT_SCHEME: http
      # --- wire up postgres if you keep it ---
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    ports: ["8080:8080", "8443:8443"]
    volumes:
      - ./certs:/opt/keycloak/conf/certs   # <- matches cert-generator
      - keycloak-data:/opt/keycloak/data
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  keycloak-data:
  postgres-data: