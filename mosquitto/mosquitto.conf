persistence true
persistence_location /mosquitto/data/
log_dest stdout

# TLS listener (published to the host)
listener 8883
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2

# Plain listener for the web UI. NOT published in docker-compose,
# so it is only reachable from other containers on the compose network.
listener 1883

# Dev only: allow anonymous. Use password_file for production.
allow_anonymous true