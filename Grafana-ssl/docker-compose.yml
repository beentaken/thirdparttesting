services:
  cert-generator:
    image: alpine:3.20
    container_name: cert-generator
    volumes:
      - ./cert:/out
      - certs:/certs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -f /certs/tls.crt ]; then
          apk add --no-cache openssl >/dev/null
          openssl req -x509 -newkey rsa:4096 -nodes \
            -keyout /certs/tls.key \
            -out    /certs/tls.crt \
            -days 365 \
            -subj "/C=US/ST=State/L=City/O=Org/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,DNS:keycloak,IP:127.0.0.1"
          chmod 644 /certs/tls.key   # dev only: Keycloak runs as UID 1000
          cp /certs/tls.crt /certs/tls.key /out/
        fi
        echo "certs ready"
    restart: "no"

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_SCHEMA: public
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/tls.key
      KC_HOSTNAME: localhost
    command: ["start-dev", "--https-port=8443"]
    ports:
      - "8080:8080"
      - "8443:8443"
    depends_on:
      postgres:
        condition: service_healthy
      cert-generator:
        condition: service_completed_successfully
    volumes:
      - keycloak-data:/opt/keycloak/data
      - keycloak-logs:/opt/keycloak/logs
      - certs:/opt/keycloak/certs:ro

  grafana:
    image: grafana/grafana-enterprise:11.3.0
    container_name: grafana
    environment:
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_DOMAIN: localhost
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Keycloak SSO (fill in client id/secret)
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: change-me
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://localhost:8443/realms/master/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://keycloak:8443/realms/master/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://keycloak:8443/realms/master/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_TLS_CLIENT_CA: /etc/grafana/certs/tls.crt
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - grafana-logs:/var/log/grafana
      - ./provisioning:/etc/grafana/provisioning
      - certs:/etc/grafana/certs:ro
    depends_on:
      - keycloak
    user: "472"

volumes:
  postgres-data:
  keycloak-data:
  keycloak-logs:
  grafana-data:
  grafana-logs:
  certs: