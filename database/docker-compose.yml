services:

  # =====================================
  # MongoDB
  # =====================================
  mongodb:
    build:
      context: ./mongodb
      dockerfile: Dockerfile
    image: database-lab/mongodb:8
    container_name: mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    networks:
      - database-network


  # =====================================
  # MySQL
  # =====================================
  mysql:
    build:
      context: ./mysql
      dockerfile: Dockerfile
    image: database-lab/mysql:8.4
    container_name: mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - database-network


  # =====================================
  # Microsoft SQL Server
  # =====================================
  mssql:
    build:
      context: ./mssql
      dockerfile: Dockerfile
    image: database-lab/mssql:2022
    container_name: mssql
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer

    ports:
      - "1433:1433"

    volumes:
      - mssql_data:/var/opt/mssql

    networks:
      - database-network


  # =====================================
  # PostgreSQL
  # =====================================
  postgresql:
    build:
      context: ./postgresql
      dockerfile: Dockerfile
    image: database-lab/postgresql:18
    container_name: postgresql
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    volumes:
      - postgresql_data:/var/lib/postgresql

    networks:
      - database-network


  # =====================================
  # MariaDB
  # =====================================
  mariadb:
    build:
      context: ./mariadb
      dockerfile: Dockerfile
    image: database-lab/mariadb:11.4
    container_name: mariadb
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}

    ports:
      - "3308:3306"

    volumes:
      - mariadb_data:/var/lib/mysql

    networks:
      - database-network


  # =====================================
  # Mongo Express (MongoDB UI)
  # =====================================
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: root
      ME_CONFIG_BASICAUTH_PASSWORD: change_me
    ports:
      - "8081:8081"
    networks:
      - database-network


  # =====================================
  # phpMyAdmin (MySQL + MariaDB)
  # =====================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
      - mariadb
    environment:
      PMA_HOSTS: mysql,mariadb
      PMA_PORTS: 3306,3306
      PMA_VERBOSES: MySQL 8.4,MariaDB 11.4
    ports:
      - "8080:80"
    networks:
      - database-network


  # =====================================
  # pgAdmin (PostgreSQL)
  # =====================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    depends_on:
      - postgresql
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: change_me
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - database-network


  # =====================================
  # CloudBeaver (web DBeaver: SQL Server, PostgreSQL, MySQL, MariaDB)
  # =====================================
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver
    restart: unless-stopped
    depends_on:
      - mssql
    ports:
      - "8978:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    networks:
      - database-network

# =====================================
# Persistent volumes
# =====================================
volumes:
  mongodb_data:
  mysql_data:
  mssql_data:
  postgresql_data:
  mariadb_data:
  pgadmin_data:
  cloudbeaver_data:
# =====================================
# Docker network
# =====================================
networks:
  database-network:
    driver: bridge