bind 0.0.0.0
protected-mode yes

# For testing purposes - simple TLS without client auth
port 0
tls-port 6379

# TLS files (inside Redis container)
tls-cert-file /etc/redis/certs/redis.crt
tls-key-file  /etc/redis/certs/redis.key
tls-ca-cert-file /etc/redis/certs/ca.crt

# Disable client certificate requirement for easier testing
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"

# Auth
requirepass ${REDIS_PASSWORD}

# Persistence (optional)
appendonly yes
dir /data
