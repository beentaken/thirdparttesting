services:
  certgen:
    image: alpine:3.20
    container_name: redis-certgen
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /certs /export && cd /certs

        # Reuse existing certs unless FORCE=1
        if [ "$${FORCE:-0}" != "1" ] \
           && [ -f ca.crt ] && [ -f redis.crt ] && [ -f redis.key ] \
           && [ -f client.crt ] && [ -f client.key ]; then
          echo "[certgen] certs already present in volume — skipping generation"
        else
          echo "[certgen] generating fresh certs"
          apk add --no-cache openssl >/dev/null

          # --- CA ---
          openssl genrsa -out ca.key 4096
          openssl req -x509 -new -nodes -sha256 -days 3650 -key ca.key -out ca.crt \
            -subj "/C=SG/ST=Singapore/L=Singapore/O=MyOrg/OU=CA/CN=MyRedisCA"

          # --- Server cert ---
          openssl genrsa -out redis.key 4096
          openssl req -new -sha256 -key redis.key -out redis.csr \
            -subj "/C=SG/ST=Singapore/L=Singapore/O=MyOrg/OU=Redis/CN=redis"
          printf '%s\n' \
            'basicConstraints = CA:FALSE' \
            'keyUsage = digitalSignature, keyEncipherment' \
            'extendedKeyUsage = serverAuth, clientAuth' \
            'subjectAltName = @alt_names' \
            '' \
            '[alt_names]' \
            'DNS.1 = redis' \
            'DNS.2 = localhost' \
            'DNS.3 = redis.local' \
            'IP.1 = 127.0.0.1' > redis.ext
          openssl x509 -req -sha256 -days 3650 -in redis.csr -CA ca.crt -CAkey ca.key \
            -CAcreateserial -out redis.crt -extfile redis.ext

          # --- Client cert (Celery mTLS) ---
          openssl genrsa -out client.key 4096
          openssl req -new -sha256 -key client.key -out client.csr \
            -subj "/C=SG/ST=Singapore/L=Singapore/O=MyOrg/OU=Client/CN=celery-client"
          printf '%s\n' \
            'basicConstraints = CA:FALSE' \
            'keyUsage = digitalSignature, keyEncipherment' \
            'extendedKeyUsage = clientAuth' > client.ext
          openssl x509 -req -sha256 -days 3650 -in client.csr -CA ca.crt -CAkey ca.key \
            -CAcreateserial -out client.crt -extfile client.ext

          chmod 600 *.key && chmod 644 *.crt
          chown -R 999:999 /certs 2>/dev/null || true
          echo "[certgen] generation done"
        fi

        # --- Always export safe files to the host bind-mount ---
        # Public: ca.crt, redis.crt, client.crt, client.key
        # NEVER export: ca.key, redis.key
        echo "[certgen] exporting public/client files to /export"
        cp -f ca.crt redis.crt client.crt client.key /export/
        chmod 644 /export/*.crt
        chmod 600 /export/client.key
        ls -la /export
    environment:
      - FORCE=${FORCE:-0}
    volumes:
      - certs:/certs                # source of truth
      - ./certs:/export             # host-visible export (no server/CA keys)
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: redis-tls
    depends_on:
      certgen:
        condition: service_completed_successfully
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - certs:/etc/redis/certs:ro   # same volume, read-only
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cacert /etc/redis/certs/ca.crt -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # worker:
  #   build: .
  #   depends_on:
  #     redis: { condition: service_healthy }
  #   environment:
  #     - REDIS_PASSWORD=${REDIS_PASSWORD}
  #   volumes:
  #     - certs:/etc/redis/certs:ro
  #   command: celery -A tasks.celery_app worker --loglevel=info

volumes:
  certs:
  redis-data: