version: '3.8'
services:
  redis-ssl:
    image: redis:7-alpine
    container_name: redis-ssl
    command: redis-server /etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - ./redis-ssl/certs:/etc/redis/certs:ro
      - ./redis-ssl/redis.conf:/etc/redis/redis.conf:ro
      - ./redis-ssl/data:/data
    restart: unless-stopped
    networks:
      - redis-network

networks:
  redis-network:
    driver: bridge