# Enable SSL/TLS for AMQP
listeners.ssl.default = 5671
listeners.tcp.default = 5672

# SSL/TLS configuration - Modern RabbitMQ format
ssl_options.cacertfile = /etc/rabbitmq/certs/ca.pem
ssl_options.certfile = /etc/rabbitmq/certs/rabbitmq.pem
ssl_options.keyfile = /etc/rabbitmq/certs/rabbitmq-key.pem
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = true

# Management plugin SSL
management.ssl.port = 15671
management.ssl.cacertfile = /etc/rabbitmq/certs/ca.pem
management.ssl.certfile = /etc/rabbitmq/certs/rabbitmq.pem
management.ssl.keyfile = /etc/rabbitmq/certs/rabbitmq-key.pem

# Disable plain AMQP if you want only SSL connections (uncomment to enforce)
# listeners.tcp = none

# Additional security settings
ssl_options.depth = 2
ssl_options.password = ""