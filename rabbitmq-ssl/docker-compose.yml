services:
  # One-shot container: generates CA/server/client certs into ./certs, then exits
  cert-generator:
    image: alpine:3.20
    container_name: rabbitmq-cert-generator
    environment:
      CERT_DIR: /certs
      CERT_HOST: rabbitmq          # CN; SANs also include localhost and 127.0.0.1
    volumes:
      - ./gen-certs.sh:/gen-certs.sh:ro
      - ./certs:/certs
    command: sh -c "apk add --no-cache openssl bash >/dev/null && bash /gen-certs.sh"
    restart: "no"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    hostname: rabbitmq
    depends_on:
      cert-generator:
        condition: service_completed_successfully
    ports:
      - "5671:5671"
      - "15671:15671"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: changeme
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./certs:/etc/rabbitmq/certs:ro
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
